<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">JEV Project Atlas</title>
  <desc id="desc">A dark blue and teal map of the open JEV ecosystem.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#10243d"/>
      <stop offset="1" stop-color="#083344"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#2dd4bf" stop-opacity=".5"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <circle cx="1030" cy="60" r="220" fill="url(#glow)" filter="url(#blur)"/>
  <g fill="none" stroke-linecap="round">
    <path d="M735 84 850 135 945 76 1068 142 1005 258 880 278 782 225Z" stroke="#67e8f9" stroke-opacity=".34" stroke-width="2"/>
    <path d="m850 135 30 143m65-202 60 182M735 84l47 141m286-83-218-7m155 123-223-33" stroke="#5eead4" stroke-opacity=".24"/>
  </g>
  <g fill="#99f6e4">
    <circle cx="735" cy="84" r="7"/><circle cx="850" cy="135" r="11"/><circle cx="945" cy="76" r="7"/>
    <circle cx="1068" cy="142" r="9"/><circle cx="1005" cy="258" r="7"/><circle cx="880" cy="278" r="8"/><circle cx="782" cy="225" r="6"/>
  </g>
  <g font-family="Inter,Segoe UI,Arial,sans-serif" fill="#f8fafc">
    <text x="76" y="138" font-size="74" font-weight="780" letter-spacing="-2">JEV Project Atlas</text>
    <text x="80" y="194" font-size="25" fill="#99f6e4" letter-spacing="4">DISCOVER · VERIFY · UNDERSTAND</text>
    <text x="80" y="250" font-size="22" fill="#cbd5e1">GitHub 上的 JEV / System One 开源生态全景图</text>
  </g>
  <rect x="80" y="286" width="150" height="5" rx="2.5" fill="#2dd4bf"/>
</svg>
