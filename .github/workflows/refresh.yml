name: Refresh JEV catalog

on:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh public data and generated pages
        run: python scripts/sync.py
      - name: Commit changed snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.zh-CN.md CATALOG.md CATALOG.zh-CN.md data docs/data.js
          git diff --cached --quiet || git commit -m "chore: refresh JEV ecosystem snapshot"
          git push
